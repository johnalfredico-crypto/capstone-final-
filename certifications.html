<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certifications | STI</title>
<link rel="stylesheet" href="styles%20(1).css">
<script src="app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="app">
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()">
</div>
<div class="page active" id="page-certifications">
<div class="shell">
<div class="sidebar" id="sidebar-certifications">
</div>
<div class="main">
<div class="topbar" id="topbar-certifications">
</div>
<div class="content">
<h2 class="page-title">Certifications &amp; Scholarship Verification</h2>
<div class="greet">Verify student eligibility for scholarships and Good Moral certifications, view detailed action logs, and process final dropout approvals.</div>
<div class="filters">
<div class="search"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="certSearch" placeholder="Search for a student by name or ID number" oninput="renderCertTable()">
<button onclick="renderCertTable()">Search</button>
</div>
<select id="certYearFilter" onchange="renderCertTable()">
<option value="">Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
<select id="certCourseFilter" onchange="renderCertTable()">
<option value="">Course</option>
<option>BSIT</option>
<option>BSHM</option>
<option>BSTM</option>
</select>
</div>
<div class="card">
<div class="table-scroll">
<table id="certTableWrap">
<tr>
<th>Student</th>
<th>ID</th>
<th>Course/Year</th>
<th>Violations</th>
<th>Status</th>
<th>Scholarship</th>
<th>Good Moral</th>
<th>Actions</th>
</tr>
</table>
</div>
<div id="certEmptyNote" class="empty-note" style="display:none;">No students on file yet.</div>
</div>
</div>
</div>
</div>
</div>
</div>
<script type="module">
	import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
	import { getFirestore, collection, addDoc, getDocs, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
	const firebaseConfig = window.__APP_API_CONFIG__.firebase;
	const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);
	window.db = db;
	window.fs = { collection, addDoc, getDocs, onSnapshot, doc, setDoc, deleteDoc, updateDoc };
</script>
<script src="script%20(1).js">
</script>
</body>
</html>

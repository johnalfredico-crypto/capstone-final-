<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students | STI</title>
<link rel="stylesheet" href="styles%20(1).css">
<script src="app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="app">
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()">
</div>
<div class="page active" id="page-students">
<div class="shell">
<div class="sidebar" id="sidebar-students">
</div>
<div class="main">
<div class="topbar" id="topbar-students">
</div>
<div class="content">
<div class="filters">
<div class="search"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="studentSearch" placeholder="Search for a student by name or ID number" oninput="renderStudentTable()">
<button onclick="renderStudentTable()">Search</button>
</div>
<select id="studentYearLevelFilter" onchange="renderStudentTable()">
<option value="">Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
<select id="studentCourseFilter" onchange="renderStudentTable()">
<option value="">Course</option>
<option>BSIT</option>
<option>BSHM</option>
<option>BSTM</option>
</select>
<select id="studentSectionFilter" onchange="renderStudentTable()">
<option value="">All Sections</option>
<option>A</option>
<option>B</option>
<option>C</option>
</select>
</div>
<div class="btnrow" style="justify-content:flex-end;" id="studentsAddBtnRow">
<button id="addStudentBtn" class="pill-btn gold add-student-btn" type="button" onclick="startAddStudent()">Add Student</button>
</div>
<div class="card">
<div class="table-scroll">
<table id="studentTableWrap">
<tr>
<th>Name</th>
<th>School ID</th>
<th>Course/Year</th>
<th>Gender</th>
<th>Violation count</th>
<th>Actions</th>
</tr>
</table>
</div>
<div id="studentEmptyNote" class="empty-note" style="display:none;">No students yet. Click "Add Student" to get started.</div>
</div>
</div>
</div>
</div>
</div>

<script type="module">
	import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
	import {
		getFirestore, collection, addDoc, getDocs, onSnapshot, doc, setDoc, deleteDoc, updateDoc
	} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

	const firebaseConfig = window.__APP_API_CONFIG__.firebase;
	const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);
	window.db = db;
	window.fs = { collection, addDoc, getDocs, onSnapshot, doc, setDoc, deleteDoc, updateDoc };
</script>
<script src="script%20(1).js"></script>
<script>
	window.startAddStudent = function() {
		if (typeof window.showPage === 'function') {
			window.showPage('addstudent');
		} else {
			window.location.href = 'addstudent.html';
		}
	};
</script>
</body>
</html>
